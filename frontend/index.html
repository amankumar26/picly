<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface-bg: #0e0f12;
      --surface-card: #18191e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #ffffff;
      --text-secondary: #9da3af;
      --text-accent: #38bdf8;
      --fill-primary: #ffffff;
      --on-primary: #0e0f12;
      --bg-accent: rgba(56, 189, 248, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #08090b;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .mobile-frame {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: var(--surface-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 500px) {
      .mobile-frame {
        min-height: 820px;
        height: 90vh;
        border-radius: 36px;
        border: 1px solid var(--border-strong);
      }
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 12px;
      background: var(--surface-bg);
      border-bottom: 0.5px solid var(--border-subtle);
    }

    .app-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .settings-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      transition: color 0.15s;
    }

    .settings-btn:hover {
      color: #ffffff;
    }

    .home-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      overflow-y: auto;
      gap: 16px;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-choose {
      background: #ffffff;
      color: #0e0f12;
      border: none;
    }

    .btn-choose:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-take {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 0.5px solid var(--border-strong);
    }

    .btn-take:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .recent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .recent-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s;
    }

    .recent-card:hover {
      transform: translateY(-2px);
    }

    .pic {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      height: 86px;
      background: #85B7EB;
      border: 0.5px solid var(--border-subtle);
    }

    .sun {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #FAC775;
      top: 16%;
      right: 18%;
    }

    .h1 {
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 80%;
      height: 70%;
      border-radius: 50%;
      background: #1D9E75;
    }

    .h2 {
      position: absolute;
      bottom: -40%;
      right: -25%;
      width: 90%;
      height: 65%;
      border-radius: 50%;
      background: #0F6E56;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 4px 14px;
      background: var(--surface-bg);
      border-top: 0.5px solid var(--border-subtle);
      margin-top: auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item.active {
      color: var(--text-accent);
    }
  </style>
</head>
<body>
  <input type="file" id="filePicker" accept="image/*" style="display:none;" />
  <input type="file" id="cameraPicker" accept="image/*" capture="environment" style="display:none;" />

  <div class="mobile-frame">
    <!-- Header -->
    <header class="app-header">
      <span class="app-title">Photo editor</span>
      <button class="settings-btn" title="Settings"><i class="ti ti-settings"></i></button>
    </header>

    <!-- Content -->
    <main class="home-body">
      <div class="action-group">
        <button type="button" class="btn btn-choose" id="btnChoosePhoto">
          <i class="ti ti-photo"></i> Choose photo
        </button>
        <button type="button" class="btn btn-take" id="btnTakePhoto">
          <i class="ti ti-camera"></i> Take photo
        </button>
      </div>

      <div class="section-title">Recent edits</div>

      <div class="recent-grid">
        <a href="feature/adjust/index.html" class="recent-card" data-preset="1">
          <div class="pic"><div class="sun"></div><div class="h1"></div><div class="h2"></div></div>
        </a>

        <a href="feature/adjust/index.html" class="recent-card" data-preset="2">
          <div class="pic" style="background:#F0997B">
            <div class="sun" style="background:#FAEEDA"></div>
            <div class="h1" style="background:#993C1D"></div>
            <div class="h2" style="background:#712B13"></div>
          </div>
        </a>

        <a href="feature/adjust/index.html" class="recent-card" data-preset="3">
          <div class="pic" style="background:#AFA9EC">
            <div class="sun"></div>
            <div class="h1" style="background:#534AB7"></div>
            <div class="h2" style="background:#3C3489"></div>
          </div>
        </a>

        <a href="feature/adjust/index.html" class="recent-card" data-preset="4">
          <div class="pic" style="background:#D3D1C7">
            <div class="sun" style="background:#F1EFE8"></div>
            <div class="h1" style="background:#5F5E5A"></div>
            <div class="h2" style="background:#444441"></div>
          </div>
        </a>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active"><i class="ti ti-home"></i><span>Home</span></a>
      <a href="feature/adjust/index.html" class="nav-item"><i class="ti ti-folder"></i><span>Projects</span></a>
      <a href="feature/save/index.html" class="nav-item"><i class="ti ti-user"></i><span>Profile</span></a>
    </nav>
  </div>

  <script src="feature/editor.js"></script>
  <script>
    const filePicker = document.getElementById('filePicker');
    const cameraPicker = document.getElementById('cameraPicker');

    document.getElementById('btnChoosePhoto').addEventListener('click', () => {
      filePicker.click();
    });

    document.getElementById('btnTakePhoto').addEventListener('click', () => {
      cameraPicker.click();
    });

    function handleFile(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const state = getEditorState();
          state.imageUrl = e.target.result;
          saveEditorState(state);
          window.location.href = 'feature/adjust/index.html';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    filePicker.addEventListener('change', () => handleFile(filePicker));
    cameraPicker.addEventListener('change', () => handleFile(cameraPicker));
  </script>
</body>
</html>
