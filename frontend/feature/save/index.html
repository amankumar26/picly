<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save - Photo Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../editor.css">
</head>
<body>
  <div class="mobile-frame">
    <!-- Top Header -->
    <header class="top-header">
      <a href="../adjust/index.html" class="icon-btn" title="Back"><i class="ti ti-chevron-left"></i></a>
      <span style="font-weight:600;font-size:14px;">Export Photo</span>
      <a href="../../index.html" class="icon-btn check-btn" title="Home"><i class="ti ti-check"></i></a>
    </header>

    <!-- Editor Body -->
    <main class="editor-body">
      <div class="preview-stage">
        <canvas id="exportCanvas" style="max-width:100%;max-height:100%;border-radius:12px;"></canvas>
      </div>

      <div id="saveToast" style="display:none;background:rgba(16,185,129,0.2);border:0.5px solid #10b981;color:#34d399;padding:8px 12px;border-radius:10px;font-size:12px;align-items:center;gap:6px;">
        <i class="ti ti-circle-check"></i> Image downloaded successfully!
      </div>

      <section class="controls-card">
        <div class="card-header">
          <span>Format</span>
          <span style="color:var(--text-secondary);font-size:11px;">High Quality</span>
        </div>

        <div class="chips-row">
          <button type="button" class="chip-btn active" data-format="image/jpeg">JPG</button>
          <button type="button" class="chip-btn" data-format="image/png">PNG</button>
          <button type="button" class="chip-btn" data-format="image/webp">WEBP</button>
        </div>

        <button type="button" class="btn-primary" id="btnDownload">
          <i class="ti ti-download"></i> Save to Device
        </button>

        <button type="button" class="btn-secondary" id="btnShare">
          <i class="ti ti-share"></i> Share Photo
        </button>

        <a href="../../index.html" class="btn-secondary" style="background:transparent;border-color:transparent;color:var(--text-secondary);">
          <i class="ti ti-home"></i> Back to Home
        </a>
      </section>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="../adjust/index.html" class="nav-link"><i class="ti ti-adjustments"></i><span>Adjust</span></a>
      <a href="../filter/index.html" class="nav-link"><i class="ti ti-wand"></i><span>Filters</span></a>
      <a href="../crop/index.html" class="nav-link"><i class="ti ti-crop"></i><span>Crop</span></a>
      <a href="../save/index.html" class="nav-link active"><i class="ti ti-download"></i><span>Save</span></a>
    </nav>
  </div>

  <script src="../editor.js"></script>
  <script>
    const state = getEditorState();
    const canvas = document.getElementById('exportCanvas');
    const ctx = canvas.getContext('2d');
    let chosenFormat = 'image/jpeg';

    function renderToCanvas() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        let w = img.naturalWidth || 800;
        let h = img.naturalHeight || 600;

        if (state.aspectRatio === '1:1') {
          const side = Math.min(w, h);
          w = side; h = side;
        } else if (state.aspectRatio === '4:3') {
          h = Math.round(w * 3 / 4);
        } else if (state.aspectRatio === '16:9') {
          h = Math.round(w * 9 / 16);
        }

        canvas.width = w;
        canvas.height = h;

        ctx.filter = computeFilterCss(state);
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.rotate((state.rotation * Math.PI) / 180);
        ctx.scale(state.flipH ? -1 : 1, state.flipV ? -1 : 1);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        ctx.restore();
      };
      img.src = state.imageUrl;
    }

    document.querySelectorAll('.chip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        chosenFormat = btn.dataset.format;
        document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const link = document.createElement('a');
      const ext = chosenFormat === 'image/png' ? 'png' : chosenFormat === 'image/webp' ? 'webp' : 'jpg';
      link.download = `photo-edit-${Date.now()}.${ext}`;
      link.href = canvas.toDataURL(chosenFormat, 0.92);
      link.click();

      const toast = document.getElementById('saveToast');
      toast.style.display = 'flex';
      setTimeout(() => toast.style.display = 'none', 3000);
    });

    document.getElementById('btnShare').addEventListener('click', async () => {
      try {
        canvas.toBlob(async (blob) => {
          if (blob && navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], 'edit.jpg', { type: chosenFormat })] })) {
            await navigator.share({
              title: 'Photo Edit',
              text: 'Edited with Photo Editor',
              files: [new File([blob], 'edit.jpg', { type: chosenFormat })]
            });
          } else {
            document.getElementById('btnDownload').click();
          }
        }, chosenFormat);
      } catch (e) {
        document.getElementById('btnDownload').click();
      }
    });

    renderToCanvas();
  </script>
</body>
</html>
