<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filters - Photo Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../editor.css">
</head>
<body>
  <div class="mobile-frame">
    <!-- Top Header -->
    <header class="top-header">
      <a href="../../index.html" class="icon-btn" title="Back to Home"><i class="ti ti-x"></i></a>
      <div class="history-actions">
        <button class="icon-btn" id="btnUndo" title="Undo"><i class="ti ti-arrow-back-up"></i></button>
        <button class="icon-btn" id="btnRedo" title="Redo"><i class="ti ti-arrow-forward-up"></i></button>
      </div>
      <a href="../crop/index.html" class="icon-btn check-btn" title="Crop"><i class="ti ti-check"></i></a>
    </header>

    <!-- Editor Body -->
    <main class="editor-body">
      <div class="preview-stage">
        <img id="previewImg" alt="Filter preview" />
      </div>

      <section class="controls-card">
        <div class="card-header">
          <span>Filters</span>
          <span id="activeFilterName" style="color:var(--text-accent);font-size:12px;text-transform:uppercase;">NONE</span>
        </div>

        <div class="filters-list" id="filtersList">
          <div class="filter-item active" data-filter="none">
            <div class="filter-thumb"><img id="thumb-none" alt="None" /></div>
            <span class="filter-label">None</span>
          </div>
          <div class="filter-item" data-filter="bw">
            <div class="filter-thumb" style="filter:grayscale(100%);"><img id="thumb-bw" alt="B&W" /></div>
            <span class="filter-label">B&W</span>
          </div>
          <div class="filter-item" data-filter="sepia">
            <div class="filter-thumb" style="filter:sepia(85%);"><img id="thumb-sepia" alt="Sepia" /></div>
            <span class="filter-label">Sepia</span>
          </div>
          <div class="filter-item" data-filter="warm">
            <div class="filter-thumb" style="filter:sepia(35%) saturate(140%) hue-rotate(-15deg);"><img id="thumb-warm" alt="Warm" /></div>
            <span class="filter-label">Warm</span>
          </div>
          <div class="filter-item" data-filter="cool">
            <div class="filter-thumb" style="filter:hue-rotate(180deg);"><img id="thumb-cool" alt="Cool" /></div>
            <span class="filter-label">Cool</span>
          </div>
          <div class="filter-item" data-filter="vintage">
            <div class="filter-thumb" style="filter:sepia(40%) contrast(120%);"><img id="thumb-vintage" alt="Vintage" /></div>
            <span class="filter-label">Vintage</span>
          </div>
          <div class="filter-item" data-filter="vivid">
            <div class="filter-thumb" style="filter:saturate(190%);"><img id="thumb-vivid" alt="Vivid" /></div>
            <span class="filter-label">Vivid</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="../adjust/index.html" class="nav-link"><i class="ti ti-adjustments"></i><span>Adjust</span></a>
      <a href="../filter/index.html" class="nav-link active"><i class="ti ti-wand"></i><span>Filters</span></a>
      <a href="../crop/index.html" class="nav-link"><i class="ti ti-crop"></i><span>Crop</span></a>
      <a href="../save/index.html" class="nav-link"><i class="ti ti-download"></i><span>Save</span></a>
    </nav>
  </div>

  <script src="../editor.js"></script>
  <script>
    const state = getEditorState();
    const previewImg = document.getElementById('previewImg');
    const activeLabel = document.getElementById('activeFilterName');

    // Populate thumbnails
    document.querySelectorAll('.filter-thumb img').forEach(img => img.src = state.imageUrl);

    function updateFilterUI() {
      applyPreviewStyles(previewImg, state);
      activeLabel.textContent = state.filter;
      document.querySelectorAll('.filter-item').forEach(item => {
        item.classList.toggle('active', item.dataset.filter === state.filter);
      });
    }

    document.querySelectorAll('.filter-item').forEach(item => {
      item.addEventListener('click', () => {
        state.filter = item.dataset.filter;
        saveEditorState(state);
        updateFilterUI();
      });
    });

    updateFilterUI();
  </script>
</body>
</html>
