<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop - Photo Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../editor.css">
</head>
<body>
  <div class="mobile-frame">
    <!-- Top Header -->
    <header class="top-header">
      <a href="../../index.html" class="icon-btn" title="Back to Home"><i class="ti ti-x"></i></a>
      <div class="history-actions">
        <button class="icon-btn" id="btnUndo" title="Undo"><i class="ti ti-arrow-back-up"></i></button>
        <button class="icon-btn" id="btnRedo" title="Redo"><i class="ti ti-arrow-forward-up"></i></button>
      </div>
      <a href="../save/index.html" class="icon-btn check-btn" title="Save / Export"><i class="ti ti-check"></i></a>
    </header>

    <!-- Editor Body -->
    <main class="editor-body">
      <div class="preview-stage">
        <img id="previewImg" alt="Crop preview" />
        <div class="crop-overlay" id="cropBox">
          <div class="crop-handle top-left"></div>
          <div class="crop-handle top-right"></div>
          <div class="crop-handle bottom-left"></div>
          <div class="crop-handle bottom-right"></div>
        </div>
      </div>

      <section class="controls-card">
        <div class="card-header">
          <span>Aspect Ratio</span>
          <span id="activeRatio" style="color:var(--text-accent);font-size:12px;text-transform:uppercase;">FREE</span>
        </div>

        <div class="chips-row">
          <button type="button" class="chip-btn active" data-ratio="free">Free</button>
          <button type="button" class="chip-btn" data-ratio="1-1">1:1</button>
          <button type="button" class="chip-btn" data-ratio="4-3">4:3</button>
          <button type="button" class="chip-btn" data-ratio="16-9">16:9</button>
          <button type="button" class="chip-btn" data-ratio="9-16">9:16</button>
        </div>

        <div style="display:flex;gap:8px;padding-top:6px;border-top:0.5px solid var(--border-subtle);">
          <button type="button" class="btn-secondary" id="btnRotate"><i class="ti ti-rotate-clockwise"></i> Rotate</button>
          <button type="button" class="btn-secondary" id="btnFlipH"><i class="ti ti-flip-horizontal"></i> Flip H</button>
          <button type="button" class="btn-secondary" id="btnFlipV"><i class="ti ti-flip-vertical"></i> Flip V</button>
        </div>
      </section>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="../adjust/index.html" class="nav-link"><i class="ti ti-adjustments"></i><span>Adjust</span></a>
      <a href="../filter/index.html" class="nav-link"><i class="ti ti-wand"></i><span>Filters</span></a>
      <a href="../crop/index.html" class="nav-link active"><i class="ti ti-crop"></i><span>Crop</span></a>
      <a href="../save/index.html" class="nav-link"><i class="ti ti-download"></i><span>Save</span></a>
    </nav>
  </div>

  <script src="../editor.js"></script>
  <script>
    const state = getEditorState();
    const previewImg = document.getElementById('previewImg');
    const cropBox = document.getElementById('cropBox');
    const activeRatio = document.getElementById('activeRatio');

    function updateCropUI() {
      applyPreviewStyles(previewImg, state);
      activeRatio.textContent = state.aspectRatio;

      cropBox.className = 'crop-overlay ratio-' + state.aspectRatio.replace(':', '-');

      document.querySelectorAll('.chip-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.ratio === state.aspectRatio.replace(':', '-'));
      });
    }

    document.querySelectorAll('.chip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.aspectRatio = btn.dataset.ratio.replace('-', ':');
        saveEditorState(state);
        updateCropUI();
      });
    });

    document.getElementById('btnRotate').addEventListener('click', () => {
      state.rotation = (state.rotation + 90) % 360;
      saveEditorState(state);
      updateCropUI();
    });

    document.getElementById('btnFlipH').addEventListener('click', () => {
      state.flipH = !state.flipH;
      saveEditorState(state);
      updateCropUI();
    });

    document.getElementById('btnFlipV').addEventListener('click', () => {
      state.flipV = !state.flipV;
      saveEditorState(state);
      updateCropUI();
    });

    updateCropUI();
  </script>
</body>
</html>
