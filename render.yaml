services:
  # Backend NestJS API
  - type: web
    name: picly-api
    runtime: node
    plan: free
    rootDir: backend/pe-api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20

  # Frontend Angular / Ionic Static Site
  - type: web
    name: picly-frontend
    runtime: static
    rootDir: frontend/blank
    buildCommand: npm install && npm run build
    staticPublishPath: www
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
